<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Settings</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">

        <h1>🎨 Theme Settings</h1>

        <p id="themeText">Current Theme: Light</p>

        <div class="themes">

            <button class="theme-btn light" data-theme="light">
                ☀️ Light
            </button>

            <button class="theme-btn dark" data-theme="dark">
                🌙 Dark
            </button>

            <button class="theme-btn ocean" data-theme="ocean">
                🌊 Ocean
            </button>

            <button class="theme-btn forest" data-theme="forest">
                🌲 Forest
            </button>

            <button class="theme-btn purple" data-theme="purple">
                💜 Purple
            </button>

            <button class="theme-btn sunset" data-theme="sunset">
                🔥 Sunset
            </button>

        </div>

        <div class="storage-box">

            <h3>Storage Information</h3>

            <p>
                Local Storage:
                <span id="localValue"></span>
            </p>

            <p>
                Session Storage:
                <span id="sessionValue"></span>
            </p>

        </div>

        <button id="clearBtn">
            🗑️ Reset Theme
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
