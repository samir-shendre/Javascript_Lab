<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Array Maximum & Minimum</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Array Analyzer</h1>
    <p>Maximum and Minimum Value Finder</p>

    <div class="card">

        <label>Enter Numbers</label>

        <input
            type="text"
            id="numberInput"
            placeholder="Example: 10, 25, 5, 80, 45"
        >

        <button onclick="analyzeArray()">
            Analyze Array
        </button>

        <div id="result"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
